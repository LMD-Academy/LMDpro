name: Auto Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Type checking
        run: npm run typecheck || true

      - name: 🧹 Linting
        run: npm run lint || true

      - name: 🏗️ Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/LMDpro
          NODE_ENV: production

      - name: 🔎 Verify artifact path (debug)
        run: |
          echo "Listing .next folder for debug:"
          ls -al .next || true
          echo "Listing .next/standalone for debug:"
          ls -al .next/standalone || true
          echo "Listing .next/standalone/public (artifact path):"
          ls -al .next/standalone/public || true

      - name: 📄 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.next/standalone/public'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

      - name: ✅ Deployment successful
        run: |
          echo "🎉 Deployment successful!"
          echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"
